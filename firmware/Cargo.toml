[package]
name = "epaper-hello"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
    "esp32s3",
    "embassy",
    "esp-radio",
    "esp-alloc",
    "log-04",
] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "log-04"] }
esp-alloc = { version = "0.10.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
log = "0.4"
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "dns",
] }
# `rsa`: api.kimi.com sits behind a Volcano-Engine WAF with an RSA-only cert
# chain; without RSA signature schemes the server aborts the handshake.
reqwless = { version = "0.14.0", features = ["rsa"] }
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
static_cell = "2.1"
# Pin + feature-fix: embedded-tls 0.18 needs der's `heapless` feature
# (SequenceOf/SetOf), which its own manifest fails to enable.
der = { version = "=0.8.0", features = ["heapless"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
incremental = false
lto = "fat"
opt-level = "s"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
